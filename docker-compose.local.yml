services:
  postgres:
    image: postgres:15-alpine
    container_name: axiom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AXIOM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${AXIOM_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${AXIOM_POSTGRES_DB:-axiom}
    ports:
      - "${AXIOM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - axiom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AXIOM_POSTGRES_USER:-postgres} -d ${AXIOM_POSTGRES_DB:-axiom}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Optional S3-compatible Artifact service for the multi-worker acceptance
  # gate. Start with: docker compose --profile artifacts up -d minio
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    profiles: ["artifacts"]
    container_name: axiom-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AXIOM_MINIO_ROOT_USER:-axiom-minio}
      MINIO_ROOT_PASSWORD: ${AXIOM_MINIO_ROOT_PASSWORD:-change-me-minio}
    ports:
      - "${AXIOM_MINIO_PORT:-9000}:9000"
      - "${AXIOM_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - axiom-minio-data:/data

volumes:
  axiom-postgres-data:
  axiom-minio-data:
